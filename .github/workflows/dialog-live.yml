# Dialogtest Fallgrenzen mit dem echten Modell (Mistral EU), mehrfach wiederholt.
# Seit 11.10.2026 nur mistral-small-latest (Wunsch des Nutzers); small/medium nur noch von Hand über MISTRAL_MODELL.
# Nur erfundene Daten (aufgaben/audit/dialog_live.py). Kostet je Modell und Wiederholung
# etwa zehn kurze Modellaufrufe (wenige Cent für den ganzen Lauf).
# Start von Hand: Actions -> "Dialogtest live" -> Run workflow.
# Schlüssel nur als GitHub-Secret MISTRAL_API_KEY (Actions), nie im Repo.
name: Dialogtest live
on:
  workflow_dispatch:
    inputs:
      wiederholungen:
        description: "Wiederholungen je Modell"
        default: "5"
        required: true
permissions:
  contents: write
concurrency:
  group: dialog-live
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1   # nacheinander, damit die Ratenbegrenzung von Mistral nicht greift
      matrix:
        include:
          - name: small
            modell: mistral-small-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Dialog laufen lassen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ matrix.modell }}
        run: python aufgaben/audit/dialog_live.py --llm mistral --wiederholungen ${{ github.event.inputs.wiederholungen }} --bericht dialog_live_${{ matrix.name }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialog-${{ matrix.name }}
          path: dialog_live_${{ matrix.name }}.md
          if-no-files-found: ignore
  ablegen:
    needs: lauf
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: berichte
          merge-multiple: true
      - name: Berichte ins Repo
        run: |
          cp berichte/*.md aufgaben/audit/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/dialog_live_*.md
          git diff --cached --quiet || git commit -m "Dialogtest live: Ergebnisse"
          git pull --rebase origin main && git push origin main || true
