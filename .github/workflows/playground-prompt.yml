# Dialogtest Fallgrenzen mit dem echten Modell (Mistral EU), mehrfach wiederholt.
# Nur erfundene Daten (aufgaben/audit/playground_prompt_test.py). Kostet je Modell und Wiederholung
# etwa zehn kurze Modellaufrufe (wenige Cent für den ganzen Lauf).
# Start von Hand: Actions -> "Playground-Anweisung" -> Run workflow.
# Schlüssel nur als GitHub-Secret MISTRAL_API_KEY (Actions), nie im Repo.
name: Playground-Anweisung
on:
  workflow_dispatch:
    inputs:
      wiederholungen:
        description: "Wiederholungen je Modell"
        default: "3"
        required: true
permissions:
  contents: write
concurrency:
  group: playground-prompt
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1   # nacheinander, damit die Ratenbegrenzung von Mistral nicht greift
      matrix:
        include:
          - name: t07
            modell: mistral-small-latest
            temperatur: "0.7"
          - name: t0
            modell: mistral-small-latest
            temperatur: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Vergleich laufen lassen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ matrix.modell }}
        run: python aufgaben/audit/playground_prompt_test.py --temperatur ${{ matrix.temperatur }} --wiederholungen ${{ github.event.inputs.wiederholungen }} --bericht playground_prompt_${{ matrix.name }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-${{ matrix.name }}
          path: playground_prompt_${{ matrix.name }}.md
          if-no-files-found: ignore
  ablegen:
    needs: lauf
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: berichte
          merge-multiple: true
      - name: Berichte ins Repo
        run: |
          cp berichte/*.md aufgaben/audit/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/playground_prompt_*.md
          git diff --cached --quiet || git commit -m "Playground-Anweisung: Ergebnisse"
          git pull --rebase origin main && git push origin main || true
