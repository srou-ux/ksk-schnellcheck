# Wie "Prüfen" (Job alles), legt aber die vollständige Ausgabe als Textdatei im Repo ab
# (aufgaben/audit/pruefen_protokoll.txt), damit sie auch ohne Zugriff auf die Actions-Protokolle
# lesbar ist. Start von Hand: Actions -> "Prüfen mit Protokoll" -> Run workflow. Kein Schlüssel.
name: Prüfen mit Protokoll
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt -r app/requirements-test.txt
      - name: Alle Prüfungen mit Protokoll
        run: |
          mkdir -p aufgaben/audit
          set +e
          python scripts/pruefe_alles.py > aufgaben/audit/pruefen_protokoll.txt 2>&1
          echo "Exitcode: $?" >> aufgaben/audit/pruefen_protokoll.txt
          tail -30 aufgaben/audit/pruefen_protokoll.txt
      - name: Protokoll ins Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/pruefen_protokoll.txt
          git diff --cached --quiet || git commit -m "Prüfprotokoll (GitHub, Python 3.11)"
          git pull --rebase --autostash origin main && git push origin main || true
