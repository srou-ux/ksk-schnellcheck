# Prüfung auf GitHub (frische Linux-Umgebung, Python wie im Entwicklungsbehälter .devcontainer).
# Beweist: alles Nötige steht im Repo. Ohne KI: kein Sprachmodell, kein Schlüssel, nur erfundene Testdaten.
name: Prüfen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Pakete installieren
        run: pip install --disable-pip-version-check -r app/requirements.txt -r app/requirements-test.txt
      - name: Alle Prüfungen (Regelwerk, Quellen, Prüfsummen, Kern, Testfälle, Schnellcheck, App, Gegenrechnung)
        run: python scripts/pruefe_alles.py
  oberflaeche:
    # Echter Browser und echter HTTP-Server, Fotos/Scans mit Tesseract und Poppler (wie auf dem Server).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu poppler-utils
      - run: pip install --disable-pip-version-check -r app/requirements.txt -r app/requirements-test.txt playwright
      - run: playwright install --with-deps chromium
      - name: Dokumentenoberfläche im Browser
        run: python tests/app/playwright_dokumente.py
      - name: Dokumentenprüfung über echten HTTP-Server
        run: python tests/app/livetest_dokumente.py
