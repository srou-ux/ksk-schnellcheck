# Test mit dem echten Sprachmodell (Mistral EU). Nur erfundene Fragen. Kostet ein paar Cent je Lauf.
# Startet von Hand (Actions -> "Mistral-Test" -> Run workflow) oder wenn aufgaben/audit/mistral_trigger.txt geändert wird.
# Der Schlüssel liegt nur als GitHub-Secret MISTRAL_API_KEY, nie im Repo.
name: Mistral-Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - aufgaben/audit/mistral_trigger.txt
      - aufgaben/audit/mistral_modell.txt
permissions:
  contents: write
concurrency:
  group: mistral-test
  cancel-in-progress: false
jobs:
  mistral:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Fragen durch die echte Pipeline (prüft zuerst die Modellliste)
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          export MISTRAL_MODELL="$(tr -d '[:space:]' < aufgaben/audit/mistral_modell.txt)"
          python aufgaben/audit/mistral_test.py aufgaben/audit/ergebnisse_mistral.md
      - name: Rauchtest Mistral-Adapter
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          export MISTRAL_MODELL="$(tr -d '[:space:]' < aufgaben/audit/mistral_modell.txt)"
          python -m unittest tests.app.test_mistral_rauchtest -v
      - name: Ergebnis ins Repo (damit es lesbar bleibt)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/ergebnisse_mistral.md
          git diff --cached --quiet || git commit -m "Mistral-Testlauf: Ergebnis"
          git pull --rebase origin main && git push origin main || true
