# Dialog aus der Weboberfläche mit echtem Mistral Schritt für Schritt nachspielen (Rohantworten sichtbar).
# Seit 11.10.2026 nur mistral-small-latest (Wunsch des Nutzers); small/medium nur noch von Hand über MISTRAL_MODELL.
# Nur erfundene Daten (aufgaben/audit/dialog_live.py). Kostet je Modell und Wiederholung
# etwa zehn kurze Modellaufrufe (wenige Cent für den ganzen Lauf).
# Start von Hand: Actions -> "Dialogtest live" -> Run workflow.
# Schlüssel nur als GitHub-Secret MISTRAL_API_KEY (Actions), nie im Repo.
name: Dialog nachspielen
on:
  workflow_dispatch:
    inputs:
      datei:
        description: "JSON-Datei mit Schritten (leer = Standarddialog aus dem Skript)"
        default: ""
        required: false
permissions:
  contents: write
concurrency:
  group: dialog-nachspielen
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1   # nacheinander, damit die Ratenbegrenzung von Mistral nicht greift
      matrix:
        include:
          - name: small
            modell: mistral-small-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Quellenindex (RAG) bauen
        run: python -m app.rag.index
      - name: Dialog nachspielen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ matrix.modell }}
        run: python aufgaben/audit/dialog_nachspielen.py --llm mistral ${{ github.event.inputs.datei && format('--datei {0}', github.event.inputs.datei) || '' }} --bericht dialog_nachgespielt_${{ matrix.name }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nach-${{ matrix.name }}
          path: dialog_nachgespielt_${{ matrix.name }}.md
          if-no-files-found: ignore
  ablegen:
    needs: lauf
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: berichte
          merge-multiple: true
      - name: Berichte ins Repo
        run: |
          cp berichte/*.md aufgaben/audit/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/dialog_nachgespielt_*.md
          git diff --cached --quiet || git commit -m "Dialog nachgespielt: Ergebnisse"
          git pull --rebase origin main && git push origin main || true
