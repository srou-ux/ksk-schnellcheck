# Unabhängige Geschwindigkeitsmessung der Mistral-Modelle (nur erfundene Fragen, ein paar Cent je Lauf).
# Startet von Hand (Actions -> "Mistral-Speed") oder wenn aufgaben/audit/mistral_speed_trigger.txt geändert wird.
name: Mistral-Speed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - aufgaben/audit/mistral_speed_trigger.txt
permissions:
  contents: write
concurrency:
  group: mistral-speed
  cancel-in-progress: false
jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check httpx
      - name: Messung
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python aufgaben/audit/mistral_speed.py aufgaben/audit/ergebnisse_mistral_speed.md
      - name: Ergebnis ins Repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/ergebnisse_mistral_speed.md
          git diff --cached --quiet || git commit -m "Mistral-Speed: Ergebnis"
          git pull --rebase origin main && git push origin main || true
