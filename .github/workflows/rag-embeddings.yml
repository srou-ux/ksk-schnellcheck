# Misst die Abruf-Güte MIT Mistral-Embeddings (EU) und zum Vergleich ohne, im selben Lauf.
# Start von Hand: Actions -> "RAG Embeddings messen" -> Run workflow. Schlüssel nur als GitHub-Secret
# MISTRAL_API_KEY. Kosten: beim ersten Lauf werden alle Stücke eingebettet (Größenordnung 35 Cent);
# der Index wird im Actions-Cache gehalten, danach kosten nur neue/geänderte Quellen und die Suchfragen.
name: RAG Embeddings messen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  messen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt numpy
      - uses: actions/cache@v4
        with:
          path: app/_lokal/rag.sqlite
          key: rag-emb-${{ hashFiles('app/rag/*.py', 'app/rag/*.json', 'app/rag/*.csv', 'quellen/index.csv', 'regelwerk/Regelkatalog_24_KSVG_Entwurf.xlsx') }}
          restore-keys: rag-emb-
      - name: Index mit Embeddings bauen (nur fehlende Vektoren kosten Aufrufe)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RAG_EMBEDDINGS: "1"
        run: |
          mkdir -p aufgaben/audit
          set -o pipefail
          python -m app.rag.index 2>&1 | tail -40 | tee aufgaben/audit/rag_embeddings_protokoll.txt
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("app/_lokal/rag.sqlite")
          n, z = db.execute("SELECT count(*), sum(length(fundstelle)+length(text)) FROM stuecke").fetchone()
          v = db.execute("SELECT count(*) FROM vektoren").fetchone()[0]
          print(f"Stücke {n}, mit Vektor {v}, Zeichen {z} (grob {z//4} Token)")
          PY
      - name: Güte ohne und mit Embeddings
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python -m app.rag.guete --bericht aufgaben/RAG_Bericht_ohne_Embeddings_Lauf.md | tee guete.txt
          RAG_EMBEDDINGS=1 python -m app.rag.guete --bericht aufgaben/RAG_Bericht_Embeddings.md | tee -a guete.txt
          python aufgaben/audit/rag_embeddings_varianten.py
      - name: Berichte ins Repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/erg
          for f in aufgaben/RAG_Embeddings_Varianten.md aufgaben/RAG_Bericht_Embeddings.md aufgaben/RAG_Bericht_ohne_Embeddings_Lauf.md aufgaben/audit/rag_embeddings_protokoll.txt; do
            [ -s "$f" ] && mkdir -p "/tmp/erg/$(dirname "$f")" && cp "$f" "/tmp/erg/$f"
          done
          # erst auf den neuesten Stand, dann die Ergebnisse darüber (kein Rebase-Konflikt möglich)
          for versuch in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd /tmp/erg && find . -type f) | while read -r f; do cp "/tmp/erg/$f" "$f"; git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "RAG: Abruf-Güte mit und ohne Embeddings (Mistral EU)" && git push -q origin HEAD:main && break
            sleep 5
          done
