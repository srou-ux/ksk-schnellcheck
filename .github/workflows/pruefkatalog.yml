# Prüfkatalog Stufe 1: Soll gegen Ist mit dem Demo-Modus und drei Mistral-Modellen,
# Seit 11.10.2026 nur mistral-small-latest (Wunsch des Nutzers); small/medium nur noch von Hand über MISTRAL_MODELL.
# dazu Vergleich 'roh': dieselben Fragen direkt an Mistral, ohne KSK-Assistent.
# Nur erfundene Fälle (aufgaben/audit/pruefkatalog.json). Kostet einige Cent je Lauf.
# Start von Hand: Actions -> "Prüfkatalog" -> Run workflow.
# Schlüssel nur als GitHub-Secret MISTRAL_API_KEY (Actions), nie im Repo.
# Die Berichte landen in aufgaben/audit/pruefkatalog_ergebnis_<modell>.md.
name: Prüfkatalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pruefkatalog
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: demo
            llm: fake
            modell: ""
          - name: small
            llm: mistral
            modell: mistral-small-latest
          - name: roh-small
            llm: mistral-roh
            modell: mistral-small-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Prüfkatalog laufen lassen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ matrix.modell }}
        run: python aufgaben/audit/pruefkatalog_lauf.py --llm ${{ matrix.llm }} --bericht pruefkatalog_ergebnis_${{ matrix.name }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bericht-${{ matrix.name }}
          path: pruefkatalog_ergebnis_${{ matrix.name }}.md
          if-no-files-found: ignore
  ablegen:
    needs: lauf
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: berichte
          merge-multiple: true
      - name: Berichte ins Repo
        run: |
          mkdir -p aufgaben/audit
          cp berichte/*.md aufgaben/audit/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/pruefkatalog_ergebnis_*.md
          git diff --cached --quiet || git commit -m "Prüfkatalog: Ergebnisse"
          git pull --rebase origin main && git push origin main || true
