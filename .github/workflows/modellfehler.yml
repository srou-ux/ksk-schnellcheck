# Sucht die Ursache von "Die Antwort des Sprachmodells konnte nicht verarbeitet werden" (13.10.2026):
# spielt ausgewählte Fälle mehrfach direkt im Chatbot (Browser, Mistral EU), einmal MIT und einmal
# OHNE Quellenabruf (RAG_AUS=1), und legt das Lückenprotokoll (mit dem genauen Fehlergrund) im Repo
# ab. Nur erfundene Testfälle. Schlüssel nur als GitHub-Secret MISTRAL_API_KEY.
name: Modellfehler suchen
on:
  workflow_dispatch:
    inputs:
      faelle:
        description: "Fall-IDs, kommagetrennt"
        required: true
        default: "pruefkatalog:P-16,pruefkatalog:K-01,pruefkatalog:P-20a"
      wiederholungen:
        description: "Wie oft je Variante"
        required: true
        default: "3"
      katalog:
        description: "Katalogdatei (Standard: Testarchiv)"
        required: false
        default: "tests/archiv/alle_faelle.json"
      modell:
        description: "Mistral-Modell (17.10.2026: z. B. mistral-small-latest)"
        required: false
        default: "mistral-small-latest"
permissions:
  contents: write
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt playwright
      - run: playwright install --with-deps chromium
      - run: python -m app.rag.index
      - name: Fälle mehrfach spielen (mit und ohne RAG)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ inputs.modell }}
          FAELLE: ${{ inputs.faelle }}
          N: ${{ inputs.wiederholungen }}
          KATALOG: ${{ inputs.katalog }}
        run: |
          mkdir -p aufgaben/audit
          : > aufgaben/audit/modellfehler_zusammenfassung.txt
          for variante in mit ohne; do
            for i in $(seq 1 "$N"); do
              if [ "$variante" = ohne ]; then export RAG_AUS=1; else unset RAG_AUS; fi
              export LUECKENPROTOKOLL_PFAD="$PWD/aufgaben/audit/modellfehler_${variante}.jsonl"
              export FAKTEN_PROTOKOLL_PFAD="$PWD/aufgaben/audit/modellfehler_fakten_${variante}_${GITHUB_RUN_ID}.jsonl"
              python aufgaben/audit/chatbot_direkt.py --katalog "$KATALOG" --nur "$FAELLE" --ohne-dialoge --csv "lauf_${variante}_${i}.csv" --bericht "aufgaben/audit/modellfehler_bericht_${variante}_${i}.md" || true
              echo "== ${variante} ${i}" >> aufgaben/audit/modellfehler_zusammenfassung.txt
              cut -d, -f5,8 "lauf_${variante}_${i}.csv" >> aufgaben/audit/modellfehler_zusammenfassung.txt || true
            done
          done
          cat aufgaben/audit/modellfehler_zusammenfassung.txt
      - name: Protokoll ins Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # Ergebnisse sichern, dann auf den neuesten Stand und darüber legen; bis zu 3 Versuche
          # (14.10.2026: ein Ergebnis ging verloren, als zwei Workflows gleichzeitig pushten).
          mkdir -p /tmp/erg
          for f in aufgaben/audit/modellfehler_*.jsonl aufgaben/audit/modellfehler_zusammenfassung.txt aufgaben/audit/modellfehler_bericht_*.md; do [ -f "$f" ] && mkdir -p "/tmp/erg/$(dirname "$f")" && cp "$f" "/tmp/erg/$f"; done
          for versuch in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd /tmp/erg && find . -type f) | while read -r f; do cp "/tmp/erg/$f" "$f"; git add "$f"; done
            git diff --cached --quiet && break
            git commit -q -m "Modellfehler suchen: Protokolle" && git push -q origin HEAD:main && break
            sleep 5
          done
