# Testkatalog oder ganzes Testarchiv gegen ein Sprachmodell laufen lassen (erfundene Daten).
# Standard: das ganze Testarchiv (tests/archiv/alle_faelle.json) mit mistral-small-latest (seit 17.10.2026).
# Für einen Modellwechsel: Feld "modell" ändern (z. B. mistral-medium-latest) -- Ergebnis danach mit
#   python scripts/vergleiche_ergebnisse.py <alte CSV> <neue CSV>
# vergleichen (tests/archiv/README.md). Start von Hand: Actions -> "Testkatalog" -> Run workflow.
# Schlüssel nur als GitHub-Secret MISTRAL_API_KEY, nie im Repo. Kostet wenige Cent je Lauf.
name: Testkatalog
on:
  workflow_dispatch:
    inputs:
      katalog:
        description: "Katalogdatei (Pfad im Repo)"
        required: true
        default: "tests/archiv/alle_faelle.json"
      kurzname:
        description: "Kurzname für die Berichte"
        required: true
        default: "archiv"
      modell:
        description: "Mistral-Modell (Standard seit 17.10.2026: mistral-small-latest)"
        required: true
        default: "mistral-small-latest"
permissions:
  contents: write
concurrency:
  group: testkatalog
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1  # nacheinander: sonst Ratenbegrenzung bei Mistral (HTTP 429)
      matrix:
        include:
          - name: demo
            llm: fake
          - name: saas
            llm: mistral
          - name: roh
            llm: mistral-roh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install --disable-pip-version-check -r app/requirements.txt
      - name: Quellenindex (RAG) bauen
        run: python -m app.rag.index
      - name: Katalog laufen lassen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODELL: ${{ inputs.modell }}
          MAX_KNOEPFE: "25"
          KATALOG: ${{ inputs.katalog }}
          NAME: ${{ inputs.kurzname }}_ergebnis_${{ matrix.name }}
        run: python aufgaben/audit/pruefkatalog_lauf.py --llm ${{ matrix.llm }} --katalog "$KATALOG" --details --bericht "$NAME.md" --csv "$NAME.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bericht-${{ matrix.name }}
          path: |
            ${{ inputs.kurzname }}_ergebnis_${{ matrix.name }}.md
            ${{ inputs.kurzname }}_ergebnis_${{ matrix.name }}.csv
          if-no-files-found: ignore
  ablegen:
    needs: lauf
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: berichte
          merge-multiple: true
      - name: Berichte und CSV ins Repo (CSV nur ergänzen, nie überschreiben)
        env:
          KURZ: ${{ inputs.kurzname }}
          MODELL: ${{ inputs.modell }}
        run: |
          mkdir -p aufgaben/audit tests/archiv/ergebnisse
          cp berichte/*.md aufgaben/audit/ 2>/dev/null || true
          datum=$(date +%F); stand=$(git rev-parse --short HEAD)
          for f in berichte/*.csv; do
            [ -e "$f" ] || continue
            lauf=$(basename "$f" .csv | sed "s/^${KURZ}_ergebnis_//")
            [ "$lauf" = "demo" ] || lauf="${lauf}-${MODELL}"
            ziel="tests/archiv/ergebnisse/${datum}_${KURZ}_${lauf}_${stand}.csv"
            [ -e "$ziel" ] || cp "$f" "$ziel"
          done
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aufgaben/audit/${KURZ}_ergebnis_*.md tests/archiv/ergebnisse/
          git diff --cached --quiet || git commit -m "Testkatalog ${KURZ} (${MODELL}): Ergebnisse"
          git pull --rebase --autostash origin main && git push origin main || true
